[project]
name = "drowsiness-detection-sys"
version = "0.1.0"
description = "Lightweight driver drowsiness detection baselines for edge-oriented experiments."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
baseline-b = [
    "scikit-learn>=1.3",
]
pixel-cnn = [
    "torch>=2.0",
    "torchvision>=0.15",
]
landmarks = [
    "mediapipe>=0.10.0; python_version < '3.13'",
]
onnx = [
    "onnx>=1.15",
    "onnxscript>=0.1.0",
    "onnxruntime>=1.16",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
