camera:
  source: 0
  width: 1280
  height: 720
  target_fps: 30

landmarks:
  detector: mediapipe
  model_asset_path: artifacts/models/face_landmarker.task
  max_num_faces: 1
  refine_landmarks: true
  min_detection_confidence: 0.5
  min_face_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  static_image_mode: false

thresholds:
  ear_closed: 0.21
  ear_open: 0.25
  mar_yawn: 0.65
  mar_recovery: 0.55
  head_pitch_down_degrees: 18.0
  head_pitch_up_degrees: -20.0
  eye_closed_duration_seconds: 1.5
  yawn_duration_seconds: 1.0
  head_pose_duration_seconds: 1.0
  perclos_window_seconds: 30.0
  perclos_threshold: 0.40
  perclos_min_samples: 10
  recovery_hold_seconds: 2.0
  no_face_grace_seconds: 1.0
  ema_alpha: 0.35

display:
  show_landmarks: true
  show_metrics: true
  window_name: Baseline A Drowsiness Detection
